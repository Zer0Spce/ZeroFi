name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zerofi-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Restore ZeroFi update signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@v4
        with:
          path: ~/.android/zerofi-update.keystore
          key: zerofi-update-signing-v1

      - name: Ensure ZeroFi update signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/zerofi-update.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/zerofi-update.keystore" \
              -storepass android \
              -keypass android \
              -alias zerofi \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=ZeroFi Update, OU=ZeroSpace, O=Zer0Spce, C=PH"
          fi
          keytool -list -keystore "$HOME/.android/zerofi-update.keystore" -storepass android -alias zerofi

      - name: Build debug APK
        env:
          ZEROFI_SIGNING_STORE_FILE: /home/runner/.android/zerofi-update.keystore
          ZEROFI_SIGNING_STORE_PASSWORD: android
          ZEROFI_SIGNING_KEY_ALIAS: zerofi
          ZEROFI_SIGNING_KEY_PASSWORD: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
